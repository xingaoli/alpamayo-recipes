defaults:
  # - /wandb: default # uncomment to enable W&B logging
  - /vla_processor@data.train_dataset.vla_preprocess_args: default
  - /vla_processor@data.val_dataset.vla_preprocess_args: default
data:
  collate_fn:
    _target_: alpamayo.processor.qwen_processor.collate_fn_from_model_config
    _partial_: true
    chat_template_version: r1_5
  # Waymo rds_hq (same layout as alpamayo1.5/waymo_eval): each clip contributes
  # num_segments samples at t0 = clip_start + segment_start_us +
  # i * segment_step_us, filtered by the real clip span (~19.8s @10Hz).
  # Samples follow the exact PAI contract (load_physical_aiavdataset_local):
  # 4-cam layout cross_left=0, front_wide=1, cross_right=2, front_tele=6
  # (front_tele is filled with pinhole_front; waymo has no narrow-FOV camera),
  # ego reference frame is the vehicle pose. Schedule mirrors
  # sft_base_pai_multi so train/val hyperparameters stay comparable.
  train_dataset:
    _recursive_: false
    _target_: alpamayo.data.waymo_rds.RDSWaymoDataset
    # local_dir falls back to the ALPAMAYO_WAYMO_DIR environment variable
    # (see .env); override on the CLI for other copies of the dataset.
    split: train
    num_segments: 20
    segment_start_us: 2000000
    segment_step_us: 500000
    # Smoke-test / subsampling knobs (null = use all clips).
    max_clips: null
    clip_stride: 1
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _recursive_: false
    _target_: alpamayo.data.waymo_rds.RDSWaymoDataset
    split: val
    num_segments: 20
    segment_start_us: 2000000
    segment_step_us: 500000
    max_clips: null
    clip_stride: 1
    vla_preprocess_args:
      generation_mode: true
paths:
  output_dir: ./output_sft_waymo
callbacks: {}
resume_from_checkpoint: null
evaluate:
  max_eval_steps: -1
  torch_dtype: bfloat16
  metric_runner:
    _target_: alpamayo.metrics.metric_runner.MetricRunner
    metrics:
      - _target_: alpamayo.metrics.metric_api.ReasoningSampler
        num_traj_sets: 1
        top_p: 0.98
        temperature: 0.6
        traj_only_generation: false
        max_generation_length: 256
      - _target_: alpamayo.metrics.metric_api.DistanceMetrics
trainer:
  output_dir: ${paths.output_dir}
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 1e-4
  warmup_steps: 100
  logging_steps: 5
  save_steps: 500
  save_total_limit: 2
  num_train_epochs: 3
  bf16: True
  dataloader_pin_memory: True
  dataloader_num_workers: 8
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  remove_unused_columns: False
  report_to: none # change to "wandb" when enabling W&B logging
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 1e-6
  # enable zero2 for stage 1 vlm finetuning
  deepspeed: configs/deepspeed/zero2.json
  # enable gradient checkpointing for stage 1 vlm finetuning
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false # recommended by PyTorch for performance
task_name: alpamayo_r1_5_sft_waymo
run_name: ${task_name}_${now:%Y%m%d}_${now:%H%M%S}

# Data-pipeline optimizations. zip_cache only affects the PAI chunk reader
# (harmless no-op for waymo); collate_cache / tf32 / cudnn_benchmark apply.
performance:
  zip_cache: true
  collate_cache: true
  tf32: true
  cudnn_benchmark: true
